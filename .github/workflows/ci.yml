name: CI/CD

# Ate 12/11 este arquivo era uma CI propria e minima: `coverage: none`, sem
# quality gate, sem build de imagem e sem deploy. O pipeline reutilizavel
# existia no oficina-infra-fase4 e nao era chamado por ninguem — nem aqui, nem
# no os-service, nem na execucao. O PDF da entrega afirmava o contrario.
#
# Pipeline que existe e nao roda e o problema da Fase 3 em outra forma.

on:
  push:
    branches: [main, homolog]
  pull_request:
    branches: [main, homolog]
  workflow_dispatch:

jobs:
  ci:
    uses: Ralima0711/oficina-infra-fase4/.github/workflows/ci-cd-servico.yml@main
    with:
      servico: billing-service
      php-version: "8.4"

      # sockets porque o php-amqplib 3.7.5 declara ext-sockets no composer.lock
      # — sem ela o proprio composer install falha. pcntl para o SIGTERM do
      # ConsumirFila. Os mesmos motivos que estao no Dockerfile.
      extensoes: "mbstring, pdo_sqlite, pdo_pgsql, sockets, pcntl"

      # sqlite, que e o que a suite ja usava. Trocar para pgsql exige conferir
      # que os testes deste servico rodam contra Postgres de verdade, e isso e
      # decisao de quem conhece a suite.
      db-connection: sqlite

      # Ate 15/11/2026 o gate era 50, PROVISORIO, escolhido sem medir. Medido
      # em 15/11/2026: 74,57% antes dos testes do worker AMQP, do publicador e
      # da observabilidade; 95,28% (1009/1059 instrucoes) depois, sem excluir
      # nada da medicao. 80 e a meta do enunciado.
      cobertura-minima: 80

      # Vazio pulava o job inteiro: o pipeline tinha analise e quality gate
      # escritos e desligados. O projeto existe no SonarQube Cloud desde
      # 13/11, o SONAR_TOKEN esta cadastrado e o Automatic Analysis foi
      # desligado no projeto — com ele ligado, um projeto nao aceita os dois
      # metodos e a analise vinda do CI e recusada.
      #
      # R maiusculo: a chave do PROJETO deriva do nome da conta do GitHub
      # (Ralima0711); a chave da ORGANIZACAO e ralima0711, minuscula, e vive
      # no sonar-project.properties.
      sonar-project-key: Ralima0711_oficina-billing-service

      imagem: ralima0711/oficina-billing-service
      manifestos: k8s/billing-service
      # Deploy no EKS por DISPARO MANUAL (Actions > CI/CD > Run workflow, na main),
      # dentro da janela do AWS Academy. Em push e PR fica false: as credenciais do
      # lab expiram em horas, e deploy a cada push deixaria a main vermelha quase
      # sempre. Precisa dos secrets AWS_* e KUBECONFIG validos (atualiza-secrets-fase4.sh
      # do oficina-infra-fase4). Sem eles o job FALHA em vermelho de proposito.
      deploy: ${{ github.event_name == 'workflow_dispatch' }}
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      KUBECONFIG: ${{ secrets.KUBECONFIG }}

  # Os cenários de features/*.feature rodam com o Behat, no mesmo desenho do
  # OS Service. Lá o job sobe Postgres porque a suite da OS recusa SQLite nos
  # cenários da saga. Aqui a suite PHPUnit já é SQLite em memória, e o Behat
  # segue o mesmo banco. O FeatureContext continua recusando Postgres cujo
  # nome não termina em _test: o migrate:fresh derruba as tabelas.
  bdd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Action de terceiro fixada pelo SHA do commit (regra githubactions:S7637 do Sonar).
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: "8.4"
          extensions: mbstring, pdo_sqlite, sockets
          coverage: none
      - name: Instalar dependencias
        run: composer install --prefer-dist --no-interaction --no-progress
      - name: Cenarios BDD (Behat)
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ":memory:"
          MP_ACCESS_TOKEN: TEST-token
          OTEL_EXPORTER_OTLP_ENDPOINT: ""
          OTEL_EXPORTER_OTLP_HEADERS: ""
        run: vendor/bin/behat
